<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INÍCIO · GBA MUSIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e4e4e1;--shell:#f4f4f2;--pn:#fff;--soft:#f1f1ee;--tx:#17171a;--mut:#8b8b92;--bd:#ebebe8;
  --ac:#c14428;--ac2:#e59632;--ac3:#ecb87a;--ink:#121214;--inktx:#fff;--ok:#17916a;--bad:#b3261e;--warn:#b7791f;
  --f:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
  --sh:0 1px 2px rgba(20,20,25,.04),0 8px 24px rgba(20,20,25,.05);
}
@media(prefers-color-scheme:dark){:root{--bg:#08080a;--shell:#121214;--pn:#1b1b1f;--soft:#26262b;--tx:#f4f4f5;--mut:#9b9ba3;--bd:#2b2b31;--ac:#e2623e;--ac2:#eda44f;--ac3:#f0bf86;--ink:#f4f4f5;--inktx:#111;--ok:#4fd3a1;--bad:#ff8a80;--warn:#f0c36a;--sh:none}}
*{box-sizing:border-box}
html{zoom:.82}
@media(max-width:640px){html{zoom:.92}}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 var(--f);-webkit-font-smoothing:antialiased;padding:14px}
a{color:inherit}button{font-family:inherit;cursor:pointer}
.mut{color:var(--mut)}
.shell{max-width:1640px;margin:0 auto;background:var(--shell);border-radius:38px;padding:18px 18px 30px}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--pn);border-radius:99px;padding:8px 10px;box-shadow:var(--sh)}
.brand{display:flex;align-items:center;gap:12px;padding-right:10px}
.logo{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--inktx);display:grid;place-items:center;font:700 14px var(--f)}
.brand span{font:500 20px/1 var(--f);letter-spacing:-.02em;white-space:nowrap}
.navchips{display:flex;gap:8px;flex-wrap:wrap}
.nchip{background:var(--soft);border-radius:99px;padding:11px 20px;font-size:15px;text-decoration:none;white-space:nowrap}
.nchip.on{background:var(--ink);color:var(--inktx)}
a.nchip:hover{background:color-mix(in srgb,var(--ac3) 45%,var(--soft))}
.spacer{flex:1}.upd{font-size:13.5px;color:var(--mut);padding-right:14px}
main{padding:22px 6px 10px}
h1{font:400 40px/1.1 var(--f);letter-spacing:-.03em;margin:0 0 4px}h1 b{font-weight:600}
.lead{color:var(--mut);margin:0 0 22px}
.card{background:var(--pn);border-radius:28px;padding:22px 24px;box-shadow:var(--sh)}
.card h3{margin:0 0 12px;font:500 17px var(--f)}
.sechd{margin:34px 4px 14px}.sechd h2{font:500 23px var(--f);margin:0;letter-spacing:-.02em}.sechd p{margin:2px 0 0;color:var(--mut);font-size:14px}
.note{font-size:13px;color:var(--mut);margin:8px 0 0}
.up{color:var(--ok);font-weight:600}.down{color:var(--bad);font-weight:600}

/* faixa de atenção */
.att{border-radius:28px;padding:16px 22px;display:flex;flex-direction:column;gap:8px;background:var(--pn);box-shadow:var(--sh)}
.att .hd{display:flex;align-items:center;gap:10px;font-weight:600}
.att .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.att.has .dot{background:var(--warn)}
.att.bad .dot{background:var(--bad)}
.ai{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:16px;padding:10px 14px;text-decoration:none;font-size:14.5px}
.ai i{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.ai.bad i{background:var(--bad)}
.ai .go{margin-left:auto;color:var(--ac);font-weight:600;font-size:13.5px;white-space:nowrap}
a.ai:hover{background:color-mix(in srgb,var(--ac3) 35%,var(--soft))}

/* três blocos */
.areas{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.blk{display:flex;flex-direction:column;background:var(--pn);border-radius:28px;padding:22px 24px;box-shadow:var(--sh);text-decoration:none;color:var(--tx);outline:2px solid transparent;transition:transform .15s,outline-color .15s}
a.blk:hover{transform:translateY(-2px);outline-color:var(--ac3)}
.bh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.bh .pf{background:var(--ink);color:var(--inktx);border-radius:99px;padding:5px 14px;font-weight:600;font-size:13.5px}
.bh .go{margin-left:auto;color:var(--ac);font-weight:600;font-size:14px}
.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.kp div{background:var(--soft);border-radius:14px;padding:9px 12px}
.kp span{display:block;font-size:11.5px;color:var(--mut)}.kp b{font:400 28px/1.15 var(--f);letter-spacing:-.02em}
.li{display:flex;flex-direction:column;gap:7px;font-size:13.5px}
.li div{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--bd);padding-top:7px}
.li div span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .r{color:var(--mut);white-space:nowrap}
.sub{font-size:12px;color:var(--mut);margin:0 0 6px}

/* destaques */
.row2{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
.vl{display:flex;flex-direction:column;gap:8px}
.vr{display:grid;grid-template-columns:26px 88px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--soft);border-radius:18px;padding:8px 14px 8px 12px;text-decoration:none;color:var(--tx)}
a.vr:hover{background:color-mix(in srgb,var(--ac3) 35%,var(--soft))}
.vr .rk{font-weight:700;color:var(--mut)}
.vr img,.vr .th0{width:88px;height:50px;border-radius:10px;object-fit:cover;background:var(--pn);display:block}
.vr .cp{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:14px}
.vr .mt{font-size:12px;color:var(--mut)}
.vr .v{text-align:right}.vr .v b{font-size:17px;color:var(--ok)}.vr .v span{display:block;font-size:11.5px;color:var(--mut)}
.mini{display:flex;flex-direction:column;gap:12px}
.mini .it{background:var(--soft);border-radius:18px;padding:12px 14px;text-decoration:none;color:var(--tx);display:block}
a.it:hover{background:color-mix(in srgb,var(--ac3) 35%,var(--soft))}
.mini .k{font-size:12px;color:var(--mut)}.mini .t{font-weight:600;margin:2px 0}.mini .d{font-size:13px;color:var(--mut)}
.ag{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ac{display:flex;gap:12px;background:var(--pn);border-radius:22px;padding:12px;box-shadow:var(--sh);text-decoration:none;color:var(--tx);align-items:center}
a.ac:hover{outline:2px solid var(--ac3)}
.ac img,.ac .th0{width:96px;height:56px;border-radius:12px;object-fit:cover;background:var(--soft);flex:none;display:block}
.ac .who{font-size:12px;font-weight:600;color:var(--ac)}.ac .tt{font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ac .gr{font-size:13px;margin-top:2px}

/* por artista */
.art{display:grid;grid-template-columns:minmax(150px,1.1fr) repeat(3,minmax(0,1fr));gap:12px;align-items:center;padding:12px 6px;border-top:1px solid var(--bd)}
.art.hd{border-top:none;color:var(--mut);font-size:12.5px;padding-top:0}
.art .nm{display:flex;align-items:center;gap:12px;font-weight:600}
.av{width:44px;height:44px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:13px;overflow:hidden;position:relative;flex:none}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cell{font-size:13.5px;text-decoration:none;display:block;border-radius:14px;padding:6px 10px}
a.cell:hover{background:color-mix(in srgb,var(--ac3) 35%,var(--soft))}
.cell b{font-size:17px;font-weight:600;letter-spacing:-.01em}
.cell .s{display:block;color:var(--mut);font-size:12px}
.empty{color:var(--mut)}
@media(max-width:1100px){.areas{grid-template-columns:1fr}.row2{grid-template-columns:1fr}}
@media(max-width:760px){
  .art{grid-template-columns:1fr 1fr}.art.hd{display:none}.art .nm{grid-column:1/-1}
  .vr{grid-template-columns:22px 70px minmax(0,1fr)}.vr .v{grid-column:2/-1;text-align:left}
}
@media(max-width:640px){.shell{border-radius:28px;padding:12px 12px 22px}.topbar{border-radius:30px}h1{font-size:30px}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar">
  <div class="brand"><div class="logo">GBA</div><span>YOUTUBE ARTISTAS GBA MUSIC</span></div>
  <nav class="navchips"><span class="nchip on">Início</span><a class="nchip" href="index.html">Dashboard</a><a class="nchip" href="acompanhamento.html">Acompanhamento</a><a class="nchip" href="social.html">Redes sociais</a></nav>
  <span class="spacer"></span>
  <span class="upd" id="upd"></span>
</header>
<main id="app">Carregando…</main>
</div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n==null?'—':n>=1e6?(n/1e6).toFixed(1).replace('.',',')+' mi':n>=1e4?Math.round(n/1e3)+' mil':Math.round(n).toLocaleString('pt-BR');
const N=n=>n==null?'—':Math.round(n).toLocaleString('pt-BR');
const sg=n=>(n>=0?'+':'−')+fmt(Math.abs(n));
const BRT='America/Sao_Paulo',MARCOS=[7,30,60,90],CAMPAIGNS='CAMPANHAS ONERPM';
const brDay=iso=>new Date(iso).toLocaleDateString('en-CA',{timeZone:BRT});
const T12=s=>Date.parse(s+'T12:00:00Z');
const addDays=(s,n)=>new Date(T12(s)+n*864e5).toISOString().slice(0,10);
const diffDays=(a,b)=>Math.round((T12(b)-T12(a))/864e5);
const dmy=s=>s.split('-').reverse().join('/');
const slug=n=>String(n||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const initials=c=>c?c.split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase():'GBA';
const inDays=n=>n===0?'hoje':n===1?'amanhã':'em '+n+' dias';
const ago=ms=>{const h=ms/36e5;return h<1?Math.round(ms/6e4)+' min':h<48?Math.round(h)+' h':Math.round(h/24)+' dias'};

let D,Hy,PR,S,SH,byId=new Map();
const getJ=async u=>{try{const r=await fetch(u+'?t='+Date.now());return r.ok?await r.json():null}catch{return null}};
(async()=>{
  [D,Hy,PR,S,SH]=await Promise.all([getJ('data.json'),getJ('history.json'),getJ('projects.json'),getJ('social.json'),getJ('social-history.json')]);
  (D?.videos||[]).forEach(v=>byId.set(v.id,v));
  try{render()}catch(e){$('#app').innerHTML='<div class="card">Não consegui montar a página: '+esc(e.message)+'</div>'}
})();

/* ---------- YouTube: crescimento de views ---------- */
function growth(id){
  const e=Hy?.v?.[id],v=byId.get(id);
  if(e){
    let last=-1;for(let i=e.v.length-1;i>=0;i--)if(e.v[i]!=null){last=i;break}
    if(last>=0){
      const lastDate=addDays(Hy.base,e.s+last);
      if(diffDays(lastDate,brDay(new Date()))<=3){
        let from=-1;for(let i=Math.max(0,last-7);i<last;i++)if(e.v[i]!=null){from=i;break}
        if(from>=0)return{d:e.v[last]-e.v[from],days:last-from,total:e.v[last]};
      }
    }
  }
  if(v&&v.perDay!=null)return{d:v.perDay*7,days:7,total:v.views,est:true};
  return null;
}
const pace=g=>g.d/Math.max(1,g.days)*7;
const thumb=id=>`https://i.ytimg.com/vi/${id}/mqdefault.jpg`;

/* ---------- Redes: saldo diário de seguidores ---------- */
function netMap(a){
  const m={};
  for(const [d,n] of (a.gains||[]))m[d]=n;
  for(const [d,g,l] of (a.flow||[]))m[d]=g-l;
  const h=SH?.accounts?.[a.key]?.followers||{},ds=Object.keys(h).sort();
  ds.slice(1).forEach((d,i)=>{if(!(d in m))m[d]=h[d]-h[ds[i]]});
  return m;
}
function d30(a){
  const nm=netMap(a),t=Date.now()-30*864e5,ds=Object.keys(nm).filter(d=>Date.parse(d+'T12:00:00-03:00')>=t);
  return ds.length?{n:ds.reduce((s,d)=>s+nm[d],0),part:ds.length<29}:null;
}
const PN={instagram:'Instagram',tiktok:'TikTok'};

/* ---------- Faixa de atenção ---------- */
function attention(){
  const out=[],now=Date.now(),today=brDay(new Date());
  for(const a of (S?.accounts||[])){
    if(a.platform==='instagram'&&a.tokenExpires){
      const left=diffDays(today,a.tokenExpires);
      if(left<=14)out.push({bad:left<=3,t:left<0?`O token do Instagram de <b>${esc(a.name)}</b> venceu`:`O token do Instagram de <b>${esc(a.name)}</b> vence ${inDays(left)}`,go:'Gerar novo',href:'social.html'});
    }
    if(a.error)out.push({bad:true,t:`Não consegui atualizar o ${PN[a.platform]||a.platform} de <b>${esc(a.name)}</b>: ${esc(String(a.error).slice(0,90))}`,go:'Ver redes',href:'social.html#'+slug(a.name)+'/'+a.platform});
  }
  if(S?.updatedAt&&now-Date.parse(S.updatedAt)>9*36e5)out.push({bad:now-Date.parse(S.updatedAt)>24*36e5,t:`O robô das redes sociais não atualiza há <b>${ago(now-Date.parse(S.updatedAt))}</b>`,go:'',href:''});
  if(D?.updatedAt&&now-Date.parse(D.updatedAt)>6*36e5)out.push({bad:now-Date.parse(D.updatedAt)>24*36e5,t:`O robô do YouTube não atualiza há <b>${ago(now-Date.parse(D.updatedAt))}</b>`,go:'',href:''});
  if(!D)out.push({bad:true,t:'Não consegui carregar os dados do YouTube (data.json).',go:'',href:''});
  const bad=out.some(x=>x.bad);
  return `<div class="att ${out.length?'has':''} ${bad?'bad':''}"><div class="hd"><span class="dot"></span>${out.length?`Precisa de atenção (${out.length})`:'Tudo em dia'}</div>${out.map(x=>{const tag=x.href?'a':'div';return `<${tag} class="ai ${x.bad?'bad':''}" ${x.href?`href="${x.href}"`:''}><i></i><span>${x.t}</span>${x.go?`<span class="go">${x.go} →</span>`:''}</${tag}>`}).join('')}</div>`;
}

/* ---------- Bloco: Metas ---------- */
function blockMetas(){
  const vids=D?.videos||[];
  if(!vids.length)return `<div class="blk"><div class="bh"><span class="pf">Metas</span></div><p class="empty">Sem dados do YouTube ainda.</p></div>`;
  let posted={};try{posted=JSON.parse(localStorage.getItem('posted')||'{}')}catch{}
  const cut=Date.now()-14*864e5;
  const hits=vids.filter(v=>v.reachedAt&&Date.parse(v.reachedAt)>=cut);
  const pend=hits.filter(v=>!posted[v.id+':'+v.lastMilestone]);
  const near=vids.filter(v=>v.next&&v.progress>=D.nearRatio).sort((a,b)=>b.progress-a.progress);
  return `<a class="blk" href="index.html"><div class="bh"><span class="pf">Metas · YouTube</span><span class="go">Abrir →</span></div>
    <div class="kp"><div><span>Metas batidas (14 dias)</span><b>${hits.length}</b></div><div><span>Posts pendentes</span><b>${pend.length}</b></div><div><span>Perto da meta</span><b>${near.length}</b></div><div><span>Vídeos acompanhados</span><b>${vids.length}</b></div></div>
    <p class="sub">Mais perto de bater</p><div class="li">${near.slice(0,3).map(v=>`<div><span>${esc(v.title)}</span><span class="r">${Math.floor(v.progress*100)}% · faltam ${fmt(v.remaining)}</span></div>`).join('')||'<div><span class="empty">Nenhum vídeo perto da meta agora.</span></div>'}</div></a>`;
}

/* ---------- Bloco: Projetos ---------- */
function projInfo(p){
  const today=brDay(new Date()),ds=p.videos.map(x=>{const v=byId.get(x.id);return v?brDay(v.publishedAt):x.d}).filter(d=>d&&d>'2000');
  const marcos=ds.length?MARCOS.map(n=>({n,date:ds.map(d=>addDays(d,n)).sort().pop()})):[];
  const next=marcos.find(m=>m.date>=today);
  const total=p.videos.reduce((s,x)=>s+(byId.get(x.id)?.views||0),0);
  return {p,next,total,days:diffDays(p.launch,today)};
}
function blockProjetos(){
  const ps=(PR?.projects||[]).map(projInfo),act=ps.filter(x=>x.next).sort((a,b)=>a.next.date<b.next.date?-1:1),today=brDay(new Date());
  if(!ps.length)return `<a class="blk" href="acompanhamento.html"><div class="bh"><span class="pf">Projetos</span><span class="go">Abrir →</span></div><p class="empty">Nenhum projeto cadastrado ainda.</p></a>`;
  const week=act.filter(x=>diffDays(today,x.next.date)<=7).length;
  return `<a class="blk" href="acompanhamento.html"><div class="bh"><span class="pf">Projetos</span><span class="go">Abrir →</span></div>
    <div class="kp"><div><span>Em andamento</span><b>${act.length}</b></div><div><span>Marcos nesta semana</span><b>${week}</b></div></div>
    <p class="sub">Próximos marcos</p><div class="li">${act.slice(0,3).map(x=>`<div><span>${esc(x.p.name)}</span><span class="r">${x.next.n} dias · ${inDays(diffDays(today,x.next.date))}</span></div>`).join('')||'<div><span class="empty">Nenhum marco pela frente.</span></div>'}</div></a>`;
}

/* ---------- Bloco: Redes ---------- */
function blockRedes(){
  const acc=S?.accounts||[];
  if(!acc.length)return `<a class="blk" href="social.html"><div class="bh"><span class="pf">Redes sociais</span><span class="go">Abrir →</span></div><p class="empty">Ainda sem dados das redes.</p></a>`;
  const tot=pl=>acc.filter(a=>a.platform===pl).reduce((s,a)=>s+(a.followers||0),0),has=pl=>acc.some(a=>a.platform===pl);
  const sum=pl=>{const r=acc.filter(a=>a.platform===pl).map(d30).filter(Boolean);return r.length?r.reduce((s,x)=>s+x.n,0):null};
  const kp=pl=>has(pl)?`<div><span>${PN[pl]}</span><b>${fmt(tot(pl))}</b><span class="${sum(pl)>=0?'up':'down'}">${sum(pl)==null?'':sg(sum(pl))+' em 30 dias'}</span></div>`:'';
  const rows=acc.map(a=>({a,d:d30(a)})).filter(x=>x.d).sort((x,y)=>y.d.n-x.d.n);
  return `<a class="blk" href="social.html"><div class="bh"><span class="pf">Redes sociais</span><span class="go">Abrir →</span></div>
    <div class="kp">${kp('instagram')}${kp('tiktok')}</div>
    <p class="sub">Seguidores em 30 dias</p><div class="li">${rows.slice(0,3).map(x=>`<div><span>${esc(x.a.name)} · ${PN[x.a.platform]}</span><span class="r ${x.d.n>=0?'up':'down'}">${sg(x.d.n)}</span></div>`).join('')||'<div><span class="empty">O saldo aparece depois do segundo dia de coleta.</span></div>'}</div></a>`;
}

/* ---------- Destaques da semana ---------- */
function vidRow(x,i){
  const g=x.g,v=x.v;
  return `<a class="vr" href="https://youtu.be/${esc(v.id)}" target="_blank" rel="noopener"><span class="rk">${i+1}</span><img loading="lazy" src="${thumb(v.id)}" alt="" onerror="this.outerHTML='<span class=th0></span>'"><span style="min-width:0"><div class="cp">${esc(v.title)}</div><div class="mt">${esc(v.channel)} · ${fmt(g.total)} views no total</div></span><span class="v"><b>+${fmt(g.d)}</b><span>${g.est?'ritmo de 7 dias':g.days<7?'em '+g.days+(g.days===1?' dia':' dias'):'em 7 dias'}</span></span></a>`;
}
function weekVideos(){
  const all=(D?.videos||[]).map(v=>({v,g:growth(v.id)})).filter(x=>x.g&&x.g.d>0);
  const top=[...all].sort((a,b)=>pace(b.g)-pace(a.g)).slice(0,6);
  // um destaque por artista (canal)
  const by=new Map();for(const x of all){const k=x.v.channel;if(!by.has(k)||pace(x.g)>pace(by.get(k).g))by.set(k,x)}
  const groups=[...by.entries()];
  // campanhas: vídeos dos projetos do “artista” virtual
  const ids=new Set((PR?.projects||[]).filter(p=>p.artist===CAMPAIGNS).flatMap(p=>p.videos.map(x=>x.id)));
  const camp=all.filter(x=>ids.has(x.v.id)).sort((a,b)=>pace(b.g)-pace(a.g))[0];
  if(camp)groups.push([CAMPAIGNS,camp]);
  const chans=[...new Set((D?.videos||[]).map(v=>v.channel))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const order=[...chans,CAMPAIGNS];
  groups.sort((a,b)=>order.indexOf(a[0])-order.indexOf(b[0]));
  const without=chans.filter(c=>!by.has(c));
  return {top,groups,without};
}
function bestPost(){
  const t7=Date.now()-7*864e5,all=[];
  for(const a of (S?.accounts||[]))for(const p of a.posts||[])if(Date.parse(p.date)>=t7&&p.views!=null&&!p.legacy)all.push({a,p});
  return all.sort((x,y)=>y.p.views-x.p.views)[0]||null;
}
function bestLaunch(){
  const today=brDay(new Date()),c=(PR?.projects||[]).map(projInfo).filter(x=>x.days>=0&&x.days<=30&&x.total>0).sort((a,b)=>b.total-a.total)[0];
  return c||null;
}
function highlights(){
  const {top,groups,without}=weekVideos();
  const acc=(S?.accounts||[]).map(a=>({a,d:d30(a)})).filter(x=>x.d&&x.d.n>0).sort((x,y)=>y.d.n-x.d.n)[0];
  const bp=bestPost(),bl=bestLaunch();
  const mini=[
    acc?`<a class="it" href="social.html#${slug(acc.a.name)}/${acc.a.platform}"><div class="k">Perfil que mais ganhou seguidores (30 dias)</div><div class="t">${esc(acc.a.name)} · ${PN[acc.a.platform]}</div><div class="d"><span class="up">${sg(acc.d.n)}</span> seguidores, agora com ${fmt(acc.a.followers)}</div></a>`:'',
    bp?`<a class="it" href="${esc(bp.p.url)}" target="_blank" rel="noopener"><div class="k">Post com mais views na semana</div><div class="t">${esc((bp.p.caption||'Sem legenda').slice(0,70))}</div><div class="d">${esc(bp.a.name)} · ${PN[bp.a.platform]} · <b style="color:var(--tx)">${fmt(bp.p.views)} views</b></div></a>`:`<div class="it"><div class="k">Post com mais views na semana</div><div class="d">Nenhum post publicado nos últimos 7 dias.</div></div>`,
    bl?`<a class="it" href="acompanhamento.html"><div class="k">Lançamento recente com mais views</div><div class="t">${esc(bl.p.name)}</div><div class="d">${esc(bl.p.artist||'')} · <b style="color:var(--tx)">${fmt(bl.total)} views</b> em ${bl.days} dia${bl.days===1?'':'s'}</div></a>`:''
  ].join('');
  return `
  <div class="row2">
    <div class="card"><h3>Vídeos que mais cresceram na semana</h3>${top.length?`<div class="vl">${top.map(vidRow).join('')}</div>`:'<p class="empty">O crescimento aparece depois de dois dias de coleta do robô.</p>'}<p class="note">Views ganhas nos últimos 7 dias (ou nos dias já medidos, quando o vídeo é novo).</p></div>
    <div class="card"><h3>Mais destaques</h3><div class="mini">${mini||'<p class="empty">Sem destaques ainda.</p>'}</div></div>
  </div>
  <div class="sechd" style="margin-top:26px"><h2>Destaque de cada artista</h2><p>O vídeo que mais cresceu na semana em cada canal.</p></div>
  <div class="ag">${groups.map(([name,x])=>`<a class="ac" href="https://youtu.be/${esc(x.v.id)}" target="_blank" rel="noopener"><img loading="lazy" src="${thumb(x.v.id)}" alt="" onerror="this.outerHTML='<span class=th0></span>'"><span style="min-width:0"><div class="who">${esc(name)}</div><div class="tt">${esc(x.v.title)}</div><div class="gr"><span class="up">+${fmt(x.g.d)}</span> <span class="mut">${x.g.est?'ritmo de 7 dias':x.g.days<7?'em '+x.g.days+' dias':'em 7 dias'}</span></div></span></a>`).join('')}${without.map(c=>`<div class="ac"><span class="th0"></span><span><div class="who">${esc(c)}</div><div class="tt mut">Sem crescimento medido nesta semana.</div></span></div>`).join('')}</div>`;
}

/* ---------- Visão por artista ---------- */
function artists(){
  const rows=new Map();
  const get=(name)=>{const k=slug(name);if(!rows.has(k))rows.set(k,{k,name,yt:null,ig:null,tt:null,avatar:null});return rows.get(k)};
  for(const c of new Set((D?.videos||[]).map(v=>v.channel))){
    const r=get(c),vs=D.videos.filter(v=>v.channel===c),gs=vs.map(v=>growth(v.id)).filter(Boolean);
    r.yt={views:vs.reduce((s,v)=>s+(v.views||0),0),week:gs.length?gs.reduce((s,g)=>s+g.d,0):null,near:vs.filter(v=>v.next&&v.progress>=D.nearRatio).length,n:vs.length,chan:c};
    r.avatar=D.avatars?.[c]||r.avatar;
  }
  for(const a of (S?.accounts||[])){const r=get(a.name);r[a.platform==='tiktok'?'tt':'ig']=a;r.avatar=r.avatar||a.avatar}
  return [...rows.values()].sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
}
function socCell(a,pl,r){
  if(!a)return `<div class="cell"><span class="s">${PN[pl]}</span><span class="empty">—</span></div>`;
  const d=d30(a);
  return `<a class="cell" href="social.html#${slug(a.name)}/${pl}"><span class="s">${PN[pl]}</span><b>${fmt(a.followers)}</b>${d?` <span class="${d.n>=0?'up':'down'}" style="font-size:12.5px">${sg(d.n)}</span>`:''}</a>`;
}
function byArtist(){
  const rs=artists();
  if(!rs.length)return '<div class="card"><p class="empty">Sem artistas ainda.</p></div>';
  return `<div class="card" style="padding:18px 20px"><div class="art hd"><span>Artista</span><span>YouTube</span><span>Instagram</span><span>TikTok</span></div>${rs.map(r=>`<div class="art"><div class="nm"><span class="av">${esc(initials(r.name))}${r.avatar?`<img src="${esc(r.avatar)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:''}</span>${esc(r.name)}</div>
    ${r.yt?`<a class="cell" href="index.html#${encodeURIComponent(r.yt.chan)}"><span class="s">YouTube</span><b>${fmt(r.yt.views)}</b> <span style="font-size:12.5px">views</span><span class="s">${r.yt.week!=null?`<span class="${r.yt.week>=0?'up':'down'}">${sg(r.yt.week)}</span> na semana`:'sem crescimento medido'}${r.yt.near?` · ${r.yt.near} perto da meta`:''}</span></a>`:`<div class="cell"><span class="s">YouTube</span><span class="empty">—</span></div>`}
    ${socCell(r.ig,'instagram')}${socCell(r.tt,'tiktok')}</div>`).join('')}</div>`;
}

function render(){
  const now=new Date(),stamp=[D?.updatedAt,S?.updatedAt].filter(Boolean).map(Date.parse).sort((a,b)=>b-a)[0];
  if(stamp)$('#upd').textContent='Atualizado em '+new Date(stamp).toLocaleString('pt-BR',{timeZone:BRT,day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  $('#app').innerHTML=`<h1>Visão <b>geral</b></h1><p class="lead">${now.toLocaleDateString('pt-BR',{timeZone:BRT,weekday:'long',day:'2-digit',month:'long'})}. O que precisa de você agora, o que aconteceu na semana e como está cada artista.</p>
  ${attention()}
  <div class="areas">${blockMetas()}${blockProjetos()}${blockRedes()}</div>
  <div class="sechd"><h2>Destaques da semana</h2><p>O que mais cresceu nos últimos 7 dias.</p></div>
  ${highlights()}
  <div class="sechd"><h2>Por artista</h2><p>YouTube, Instagram e TikTok lado a lado. Clique em uma rede para ver o detalhe.</p></div>
  ${byArtist()}`;
}
