<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REDES SOCIAIS · GBA MUSIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e4e4e1;--shell:#f4f4f2;--pn:#fff;--soft:#f1f1ee;--tx:#17171a;--mut:#8b8b92;--bd:#ebebe8;
  --ac:#c14428;--ac2:#e59632;--ac3:#ecb87a;--ink:#121214;--inktx:#fff;--ok:#17916a;--bad:#b3261e;
  --f:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
  --sh:0 1px 2px rgba(20,20,25,.04),0 8px 24px rgba(20,20,25,.05);
}
@media(prefers-color-scheme:dark){:root{--bg:#08080a;--shell:#121214;--pn:#1b1b1f;--soft:#26262b;--tx:#f4f4f5;--mut:#9b9ba3;--bd:#2b2b31;--ac:#e2623e;--ac2:#eda44f;--ac3:#f0bf86;--ink:#f4f4f5;--inktx:#111;--ok:#4fd3a1;--bad:#ff8a80;--sh:none}}
*{box-sizing:border-box}
html{zoom:.82}
@media(max-width:640px){html{zoom:.92}}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 var(--f);-webkit-font-smoothing:antialiased;padding:14px}
a{color:inherit}button{font-family:inherit;cursor:pointer}
.mut{color:var(--mut)}
.shell{max-width:1640px;margin:0 auto;background:var(--shell);border-radius:38px;padding:18px 18px 30px}

.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--pn);border-radius:99px;padding:8px 10px;box-shadow:var(--sh)}
.brand{display:flex;align-items:center;gap:12px;padding-right:10px}
.logo{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--inktx);display:grid;place-items:center;font:700 14px var(--f)}
.brand span{font:500 20px/1 var(--f);letter-spacing:-.02em;white-space:nowrap}
.navchips{display:flex;gap:8px;flex-wrap:wrap}
.nchip{background:var(--soft);border-radius:99px;padding:11px 20px;font-size:15px;text-decoration:none;white-space:nowrap}
.nchip.on{background:var(--ink);color:var(--inktx)}
a.nchip:hover{background:color-mix(in srgb,var(--ac3) 45%,var(--soft))}
.spacer{flex:1}
.upd{font-size:13.5px;color:var(--mut);padding-right:14px}

main{padding:22px 6px 10px}
.nets{display:flex;gap:8px;margin-bottom:18px}
.net{border:none;background:var(--pn);border-radius:99px;padding:10px 20px;font-size:14.5px;color:var(--tx);box-shadow:var(--sh)}
.net.on{background:var(--ink);color:var(--inktx)}
.net[disabled]{opacity:.5;cursor:default}

.rail{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.rb{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--tx);padding:0}
.av{width:62px;height:62px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;overflow:hidden;border:3px solid transparent;position:relative}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rb.on .av{border-color:var(--ac)}
.rb .nm{font-size:11.5px;max-width:80px;text-align:center;line-height:1.15}

h1{font:400 40px/1.1 var(--f);letter-spacing:-.03em;margin:0 0 4px}
h1 b{font-weight:600}
.lead{color:var(--mut);margin:0 0 22px}
.err{background:color-mix(in srgb,var(--bad) 12%,var(--pn));color:var(--bad);border-radius:18px;padding:12px 16px;margin:0 0 18px;font-size:14px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.card{background:var(--pn);border-radius:28px;padding:22px 24px;box-shadow:var(--sh)}
.stat .l{color:var(--mut);font-size:14.5px}
.stat b{display:block;font:400 38px/1.15 var(--f);letter-spacing:-.03em;margin-top:6px}
.stat .d{font-size:13px;margin-top:4px;color:var(--mut)}
.up{color:var(--ok);font-weight:600}.down{color:var(--bad);font-weight:600}

.charts{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:26px}
.card h3{margin:0 0 12px;font:500 17px var(--f)}
.card svg{width:100%;height:auto;display:block}
.note{font-size:13px;color:var(--mut);margin:8px 0 0}

.shead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 4px 14px}
.shead h2{font:500 22px var(--f);margin:0;letter-spacing:-.02em}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:none;background:var(--soft);border-radius:99px;padding:8px 16px;font-size:14px;color:var(--tx)}
.pill.on{background:var(--ink);color:var(--inktx)}
.shead .sp{flex:1}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pc{background:var(--pn);border-radius:26px;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;text-decoration:none}
.pc .th{position:relative;aspect-ratio:4/5;background:var(--soft)}
.pc .th img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;left:12px;top:12px;background:var(--ink);color:var(--inktx);font-size:12px;font-weight:600;padding:4px 12px;border-radius:99px}
.dt{position:absolute;right:12px;top:12px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:4px 10px;border-radius:99px}
.pc .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.cap{font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.m{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.m div{background:var(--soft);border-radius:14px;padding:8px 10px}
.m span{display:block;font-size:11.5px;color:var(--mut)}
.m b{font-size:16px;font-weight:600;letter-spacing:-.01em}
.m .big{grid-column:span 3;background:var(--ink);color:var(--inktx)}
.m .big span{color:inherit;opacity:.7}.m .big b{font-size:22px}
.empty{background:var(--pn);border-radius:28px;padding:30px;box-shadow:var(--sh)}
.empty ol{padding-left:20px;color:var(--mut)}


.charts{grid-template-columns:1.5fr 1fr}
.charts+.charts{margin-top:-12px}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin-top:8px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.heat{display:grid;grid-template-columns:44px repeat(4,1fr);gap:5px;font-size:12px}
.heat .h{color:var(--mut);text-align:center;align-self:end;padding-bottom:2px}
.heat .r{color:var(--mut);align-self:center}
.heat .c{border-radius:10px;padding:8px 4px;text-align:center;background:var(--soft);line-height:1.25}
.heat .c b{display:block;font-size:13px}
.heat .c span{font-size:11px;color:var(--mut)}
.heat .c.best{outline:2px solid var(--ac)}
.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pc{cursor:pointer;border:none;padding:0;text-align:left;color:var(--tx);font:inherit}
.pc .th{aspect-ratio:1/1}
.pc .bd{padding:12px 14px 14px;gap:8px}
.pc .big2{display:flex;justify-content:space-between;align-items:baseline}
.pc .big2 b{font-size:20px;letter-spacing:-.02em}
.pc .big2 span{font-size:12.5px;color:var(--mut)}
.pc .sm{display:flex;gap:12px;font-size:12.5px;color:var(--mut);flex-wrap:wrap}
.pc .sm b{color:var(--tx);font-weight:600}
dialog{border:none;border-radius:30px;background:var(--pn);color:var(--tx);width:min(720px,94vw);padding:0;box-shadow:0 20px 60px rgba(0,0,0,.35);max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dh{display:flex;gap:16px;padding:22px 24px 8px}
.dh img{width:96px;height:96px;border-radius:18px;object-fit:cover;background:var(--soft);flex:none}
.dh h3{margin:0 0 4px;font:500 17px/1.3 var(--f)}
.db{padding:8px 24px 24px}
.dm{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 16px}
.dm div{background:var(--soft);border-radius:14px;padding:9px 11px}
.dm span{display:block;font-size:11.5px;color:var(--mut)}.dm b{font-size:17px;font-weight:600}
.x{margin-left:auto;border:none;background:var(--soft);border-radius:99px;width:36px;height:36px;font-size:18px;color:var(--tx);flex:none}
@media(max-width:640px){.dm{grid-template-columns:repeat(2,1fr)}}
.srch{border:1px solid var(--bd);background:var(--pn);color:var(--tx);border-radius:99px;padding:9px 16px;font:inherit;font-size:14px;width:200px}
.pager{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:18px 4px 0}
.pager .sp{flex:1}.pager .pill[disabled]{opacity:.4;cursor:default}
.pager select{background:var(--soft);color:var(--tx);border:none;border-radius:99px;padding:7px 12px;font:inherit;font-size:14px}
.per{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 4px 14px}
.per input[type=date]{border:1px solid var(--bd);background:var(--pn);color:var(--tx);border-radius:99px;padding:7px 12px;font:inherit;font-size:14px;margin-left:4px}
a.pill{text-decoration:none;display:inline-block}
.back{display:inline-block;text-decoration:none;color:var(--mut);font-size:14px;margin:0 0 12px 4px}
.back:hover{color:var(--tx)}
.prof{margin-bottom:30px}
.phead{display:flex;align-items:center;gap:14px;margin:0 4px 14px}
.phead h2{font:500 26px var(--f);margin:0;letter-spacing:-.02em}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px}
.blk{display:block;background:var(--pn);border-radius:28px;padding:22px 24px;box-shadow:var(--sh);text-decoration:none;color:var(--tx);transition:transform .15s,outline-color .15s;outline:2px solid transparent}
a.blk:hover{transform:translateY(-2px);outline-color:var(--ac3)}
.blk.off{opacity:.55}
.bh{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.bh .pf{background:var(--ink);color:var(--inktx);border-radius:99px;padding:5px 14px;font-weight:600;font-size:13.5px}
.bh .go{margin-left:auto;color:var(--ac);font-weight:600;font-size:14px}
.bbig{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.bbig b{font:400 44px/1 var(--f);letter-spacing:-.03em;display:block}
.bbig .d{font-size:13.5px;margin-top:6px;color:var(--mut)}
.bm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.bm div{background:var(--soft);border-radius:14px;padding:9px 11px}
.bm span{display:block;font-size:11.5px;color:var(--mut)}.bm b{font-size:17px;font-weight:600}
.bbest{margin:12px 0 0;font-size:13px;color:var(--mut)}
.row{display:grid;gap:14px;margin-bottom:14px}
.row.a{grid-template-columns:1.5fr 1fr}.row.b{grid-template-columns:1fr 1fr}.row.c{grid-template-columns:1.25fr 1fr}
.sechd{margin:34px 4px 14px}
.sechd h2{font:500 23px var(--f);margin:0;letter-spacing:-.02em}
.sechd p{margin:2px 0 0;color:var(--mut);font-size:14px}
.hb .hr{display:grid;grid-template-columns:minmax(110px,170px) 1fr 78px;gap:10px;align-items:center;margin:10px 0;font-size:13.5px}
.hb .hl span{display:block;font-size:11.5px;color:var(--mut)}
.hb .ht{height:12px;background:var(--soft);border-radius:99px;overflow:hidden}
.hb .ht i{display:block;height:100%;border-radius:99px}
.hb b{text-align:right;font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-weight:500;color:var(--mut);text-align:right;padding:6px 8px;font-size:12px}
.tbl td{text-align:right;padding:9px 8px;border-top:1px solid var(--bd)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.top{display:flex;flex-direction:column;gap:8px}
.tr{display:grid;grid-template-columns:26px 52px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--soft);border:none;border-radius:18px;padding:8px 14px 8px 12px;text-align:left;color:var(--tx);font:inherit;width:100%;cursor:pointer}
.tr:hover{background:color-mix(in srgb,var(--ac3) 35%,var(--soft))}
.tr .rk{font-weight:700;color:var(--mut)}
.tr img,.tr .th0{width:52px;height:52px;border-radius:12px;object-fit:cover;background:var(--pn);display:block}
.tr .cp{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:14px}
.tr .mt{font-size:12px;color:var(--mut)}
.tr .vl{text-align:right}.tr .vl b{font-size:18px;letter-spacing:-.01em}
.tr .vl span{display:block;font-size:11.5px;color:var(--ok);font-weight:600}
.ins{background:color-mix(in srgb,var(--ac3) 28%,var(--pn));border-radius:16px;padding:10px 14px;font-size:13.5px;margin:12px 0 0}
.how{margin:0;padding-left:18px;font-size:13.5px;color:var(--mut)}.how li{margin:6px 0}.how b{color:var(--tx)}
@media(max-width:1100px){.row.a,.row.b,.row.c{grid-template-columns:1fr}}
@media(max-width:640px){.pgrid{grid-template-columns:1fr}.hb .hr{grid-template-columns:100px 1fr 70px}}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}}
@media(max-width:640px){.shell{border-radius:28px;padding:12px 12px 22px}.topbar{border-radius:30px}h1{font-size:30px}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar">
  <div class="brand"><div class="logo">GBA</div><span>YOUTUBE ARTISTAS GBA MUSIC</span></div>
  <nav class="navchips"><a class="nchip" href="index.html">Dashboard</a><a class="nchip" href="acompanhamento.html">Acompanhamento</a><span class="nchip on">Redes sociais</span></nav>
  <span class="spacer"></span>
  <span class="upd" id="upd"></span>
</header>
<main id="app">Carregando…</main>
</div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n==null?'—':n>=1e6?(n/1e6).toFixed(1).replace('.',',')+' mi':n>=1e4?Math.round(n/1e3)+' mil':n.toLocaleString('pt-BR');
const pct=n=>n==null?'—':n.toFixed(1).replace('.',',')+'%';
const TYPES={reel:'Reel',foto:'Foto',carrossel:'Carrossel',video:'Vídeo',tiktok:'TikTok'};
let plat='instagram';
const accs=()=>S.accounts.filter(x=>x.platform===plat);
const curAcc=()=>accs().find(x=>x.key===cur)||accs()[0]||S.accounts[0];
const PNAME=()=>plat==='tiktok'?'TikTok':'Instagram';
let S=null,H=null,cur=null,f={type:'all',sort:'date',q:'',page:1,size:12},R={mode:'all',from:'',to:''};

const eng=p=>{
  const inter=(p.likes||0)+(p.comments||0)+(p.saved||0)+(p.shares||0);
  const base=p.reach||p.views;
  return base>0?inter/base*100:null;
};
const dayStr=d=>new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'short',timeZone:'America/Sao_Paulo'}).replace('.','');

async function load(){
  try{
    const [a,b]=await Promise.all([
      fetch('social.json?t='+Date.now()).then(r=>r.ok?r.json():null),
      fetch('social-history.json?t='+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null)
    ]);
    S=a;H=b;
  }catch{S=null}
  if(!S||!S.accounts?.length){empty();return}
  $('#upd').textContent='Atualizado em '+new Date(S.updatedAt).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  route();
}

function empty(){
  $('#app').innerHTML=`<div class="empty"><h1>Redes <b>sociais</b></h1>
  <p class="mut">Ainda não há dados. Falta configurar o robô do Instagram:</p>
  <ol><li>Guarde o segredo <b>SOCIAL_ACCOUNTS</b> no GitHub (Settings → Secrets and variables → Actions).</li>
  <li>Coloque o arquivo <b>src/social.cjs</b> e o workflow <b>redes-sociais.yml</b> no repositório.</li>
  <li>Em Actions, rode <b>Redes sociais</b> uma vez (Run workflow). Quando terminar, recarregue esta página.</li></ol></div>`;
}


const BRT='America/Sao_Paulo';
function range(){
  const now=Date.now();
  if(R.mode==='custom'&&R.from&&R.to){const a=Date.parse(R.from+'T00:00:00-03:00'),b=Date.parse(R.to+'T23:59:59-03:00');return a<=b?{a,b}:{a:b,b:a}}
  if(R.mode==='all')return {a:0,b:now};
  return {a:now-(+R.mode)*864e5,b:now};
}
const inR=iso=>{const t=Date.parse(iso),r=range();return t>=r.a&&t<=r.b};
const inDay=d=>inR(d+'T12:00:00-03:00');
const perLabel=()=>R.mode==='all'?'todo o período':R.mode==='custom'?(R.from&&R.to?`${R.from.split('-').reverse().join('/')} a ${R.to.split('-').reverse().join('/')}`:'período personalizado'):`últimos ${R.mode} dias`;
const N=n=>n==null?'—':Number(n).toLocaleString('pt-BR');
function line(pts,w=640,h=230){
  if(pts.length<2)return null;
  const P={l:62,r:14,t:12,b:26},vs=pts.map(p=>p.v);
  let mn=Math.min(...vs),mx=Math.max(...vs);if(mn===mx){mn-=1;mx+=1}
  const pad=(mx-mn)*.1;mn-=pad;mx+=pad;
  const X=i=>P.l+(w-P.l-P.r)*i/(pts.length-1),Y=v=>P.t+(h-P.t-P.b)*(1-(v-mn)/(mx-mn));
  const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  const ticks=[0,.5,1].map(t=>{const v=mn+(mx-mn)*t;return `<line x1="${P.l}" x2="${w-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--bd)"/><text x="${P.l-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--mut)">${N(Math.round(v))}</text>`}).join('');
  const lab=[0,Math.floor((pts.length-1)/2),pts.length-1].map(i=>`<text x="${X(i)}" y="${h-6}" text-anchor="${i===0?'start':i===pts.length-1?'end':'middle'}" font-size="11" fill="var(--mut)">${dayStr(pts[i].d+'T12:00:00')}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}">${ticks}<path d="${d}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(pts.length-1)}" cy="${Y(pts[pts.length-1].v)}" r="4.5" fill="var(--ac)"/>${lab}</svg>`;
}

// ganhos (para cima) e perdas (para baixo) por dia + marcas dos dias com publicação
function flowChart(a,w=760,h=260){
  let rows=(a.flow||[]).filter(r=>inDay(r[0])),mode='flow';
  if(!rows.length){rows=(a.gains||[]).filter(r=>inDay(r[0])).map(x=>[x[0],Math.max(0,x[1]),Math.max(0,-x[1])]);mode='net'}
  if(!rows.length)return null;
  const P={l:36,r:8,t:14,b:40},n=rows.length;
  const up=Math.max(1,...rows.map(r=>r[1])),dn=Math.max(0,...rows.map(r=>r[2]));
  const tot=up+dn,Y0=P.t+(h-P.t-P.b)*up/tot,sc=(h-P.t-P.b)/tot,bw=(w-P.l-P.r)/n;
  const posted={};for(const p of a.posts){const k=new Date(p.date).toLocaleDateString('en-CA',{timeZone:BRT});(posted[k]??=[]).push(p)}
  const bars=rows.map((r,i)=>{
    const x=P.l+i*bw+bw*.14,ww=bw*.72,net=r[1]-r[2];
    const t=`${dayStr(r[0]+'T12:00:00')}: +${r[1]} / −${r[2]} (saldo ${net>=0?'+':''}${net})`;
    return `<g><title>${t}</title><rect x="${x}" y="${Y0-r[1]*sc}" width="${ww}" height="${Math.max(r[1]?1:0,r[1]*sc)}" rx="2" fill="var(--ok)"/><rect x="${x}" y="${Y0}" width="${ww}" height="${r[2]*sc}" rx="2" fill="var(--bad)"/></g>`;
  }).join('');
  const marks=rows.map((r,i)=>{const ps=posted[r[0]];return ps?`<g><title>${ps.length} post(s) em ${dayStr(r[0]+'T12:00:00')}: ${ps.map(p=>TYPES[p.type]).join(', ')}</title><circle cx="${P.l+i*bw+bw/2}" cy="${h-22}" r="4" fill="var(--ac)"/></g>`:''}).join('');

const TCOL={tiktok:'var(--ac)',reel:'var(--ac)',foto:'var(--ac2)',carrossel:'var(--ac3)',video:'var(--ink)'};
function postBars(a,w=640,h=230){

  const P={l:46,r:8,t:12,b:26},mx=Math.max(1,...ps.map(p=>p.views)),bw=(w-P.l-P.r)/ps.length,Y=v=>P.t+(h-P.t-P.b)*(1-v/mx);
  const rects=ps.map((p,i)=>`<rect data-open="${esc(p.id)}" style="cursor:pointer" x="${P.l+i*bw+bw*.12}" width="${bw*.76}" y="${Y(p.views)}" height="${Math.max(1,h-P.b-Y(p.views))}" rx="3" fill="${TCOL[p.type]||'var(--ac)'}"><title>${dayStr(p.date)} · ${TYPES[p.type]}: ${N(p.views)} views</title></rect>`).join('');

function heat(a){
  const DAYS=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'],MAP={Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6},PER=['0–6h','6–12h','12–18h','18–24h'];
  const cell=Array.from({length:7},()=>Array.from({length:4},()=>[]));
  for(const p of a.posts){if(p.views==null||!inR(p.date))continue;
    const parts=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:BRT,weekday:'short',hour:'numeric',hourCycle:'h23'}).formatToParts(new Date(p.date)).map(x=>[x.type,x.value]));
    cell[MAP[parts.weekday]][Math.floor(+parts.hour/6)].push(p.views)}
  const avg=c=>c.length?c.reduce((s,x)=>s+x,0)/c.length:null;
  const all=cell.flat().map(avg).filter(x=>x!=null);if(!all.length)return null;
  const mx=Math.max(...all);let best=null;
  cell.forEach((r,i)=>r.forEach((c,j)=>{const v=avg(c);if(v===mx&&c.length>=1&&!best)best=[i,j]}));
  let out='<div class="heat"><span></span>'+PER.map(x=>`<span class="h">${x}</span>`).join('');
  cell.forEach((r,i)=>{out+=`<span class="r">${DAYS[i]}</span>`+r.map((c,j)=>{const v=avg(c);
    if(v==null)return '<div class="c"><span>—</span></div>';
    const pc=Math.round(v/mx*80);
    return `<div class="c ${best&&best[0]===i&&best[1]===j?'best':''}" style="background:color-mix(in srgb,var(--ac) ${pc}%,var(--soft));${pc>55?'color:#fff':''}"><b>${fmt(Math.round(v))}</b><span style="${pc>55?'color:#fff;opacity:.8':''}">${c.length} post${c.length>1?'s':''}</span></div>`}).join('')});
  out+='</div>';
  const bt=best?`<p class="note">Melhor combinação até agora: <b>${DAYS[best[0]]}, ${PER[best[1]]}</b> (média de views por post). Horário de Brasília. Com poucos posts por célula, trate como indício, não como regra.</p>`:'';
  return out+bt;
}

function delta(a,days){

}
function histGains(a){const h=H?.accounts?.[a.key]?.followers||{},ds=Object.keys(h).sort();return ds.slice(1).map((d,i)=>[d,h[d]-h[ds[i]]])}
function deltaR(a){
  const nm=netMap(a),ds=Object.keys(nm).filter(inDay);

}
const dl=(x,l)=>x?`<span class="${x.n>=0?'up':'down'}">${x.n>=0?'+':''}${fmt(x.n)}</span> ${l}${x.exact?'':' <span class="mut">(parcial)</span>'}`:'';

function filtered(a){

function spark(pts,w=150,h=46){

/* ───────── análises do detalhado ───────── */
function netMap(a){
  const m={};
  for(const [d,n] of (a.gains||[]))m[d]=n;
  for(const [d,g,l] of (a.flow||[]))m[d]=g-l;
  for(const [d,n] of histGains(a))if(!(d in m))m[d]=n;
  return m;
}
function netBars(a){
  const nm=netMap(a),days=Object.keys(nm).filter(inDay);
  if(days.length<3)return '<p class="mut">Ainda não há dias suficientes de seguidores para comparar. Isto melhora a cada dia que o robô roda.</p>';
  const posted={};for(const p of a.posts)(posted[dkey(p.date)]??=[]).push(p);
  const withP=days.filter(d=>posted[d]),noP=days.filter(d=>!posted[d]),m=ds=>avg(ds.map(d=>nm[d]));
  const row=(l,ds,c)=>ds.length?{l,s:`${ds.length} dia${ds.length>1?'s':''}`,v:m(ds),t:sg(m(ds))+'/dia',c}:null;
  const rows=[row('Todos os dias',days,'var(--mut)'),row('Dias sem post',noP,'var(--mut)'),row('Dias com post',withP,'var(--ac)')];
  for(const t of ['reel','foto','carrossel','video','tiktok']){const ds=days.filter(d=>posted[d]?.some(p=>p.type===t));if(ds.length&&a.posts.some(p=>p.type===t)&&(plat==='tiktok'?false:true))rows.push(row('Dia de '+TYPES[t],ds,'var(--ac2)'))}
  let ins='';
  if(withP.length>=2&&noP.length>=2){const df=m(withP)-m(noP);ins=`<p class="ins">${df>0?`Nos dias com post a conta ganhou <b>${sg(df)} seguidores por dia a mais</b> que nos dias sem post.`:`Nos dias com post a conta <b>não ganhou mais seguidores</b> que nos dias sem post (${sg(df)}/dia).`}</p>`}
  return hbars(rows.filter(Boolean))+ins+`<p class="note">Média de seguidores líquidos (ganhos − perdas) por dia, em ${days.length} dias. Isto mostra <b>correlação</b>: as redes não dizem de qual post veio cada seguidor. Poucos dias = indício, não regra.</p>`;
}
const METRICS={instagram:[['views','Views'],['reach','Alcance'],['eng','Engajamento'],['shares','Compart.'],['saved','Salvos'],['follows','Seguidores']],tiktok:[['views','Views'],['eng','Engajamento'],['shares','Compart.'],['likes','Curtidas'],['comments','Comentários']]};
const gm=(p,m)=>m==='eng'?eng(p):p[m];
function topList(a,psR){
  const pool=psR.filter(p=>!p.legacy),legN=psR.length-pool.length;
  const vals=pool.map(p=>gm(p,topM)).filter(x=>x!=null),md=med(vals);
  const top=pool.filter(p=>gm(p,topM)!=null).sort((x,y)=>gm(y,topM)-gm(x,topM)).slice(0,10);
  const show=v=>topM==='eng'?pct(v):topM==='follows'?'+'+N(v):N(v);
  const pills=`<div class="pills" style="margin-bottom:12px">${METRICS[a.platform].map(([k,l])=>`<button class="pill ${topM===k?'on':''}" data-tm="${k}" type="button">${l}</button>`).join('')}</div>`;
  if(!top.length)return pills+`<p class="mut">${topM==='follows'?'O Instagram só informa seguidores por post para fotos. Nenhuma foto neste período.':'Sem dados desta métrica neste período.'}</p>`;
  return pills+'<div class="top">'+top.map((p,i)=>{const v=gm(p,topM),x=md>0?v/md:0;
    return `<button class="tr" data-open="${esc(p.id)}" type="button"><span class="rk">${i+1}</span>${p.thumb?`<img loading="lazy" src="${esc(p.thumb)}" alt="" referrerpolicy="no-referrer" onerror="this.outerHTML='<span class=th0></span>'">`:'<span class="th0"></span>'}<span style="min-width:0"><div class="cp">${esc(p.caption)||'Sem legenda'}</div><div class="mt">${TYPES[p.type]||p.type} · ${dayStr(p.date)}</div></span><span class="vl"><b>${show(v)}</b>${x>=1.5?`<span>${x.toFixed(1).replace('.',',')}× a mediana</span>`:''}</span></button>`}).join('')+'</div>'
  +`<p class="note">Os 10 melhores do período por ${METRICS[a.platform].find(m=>m[0]===topM)[1].toLowerCase()}. Mediana do período: ${md==null?'—':topM==='eng'?pct(md):N(Math.round(md))}.${legN?` ${legN} post(s) antigo(s), que só têm impressões, ficam fora do ranking.`:''}${topM==='follows'?' Reels não têm esta métrica.':''}</p>`;

function groupStats(a,psR){
  const TT=a.platform==='tiktok',ok=psR.filter(p=>p.views!=null&&!p.legacy);
  let g;
  if(TT){
    if(!ok.some(p=>p.duration!=null))return {noDur:true,st:[]};
    g=[['Até 15 s',0,15],['15 a 30 s',15,30],['30 a 60 s',30,60],['Mais de 60 s',60,1e9]].map(([l,lo,hi])=>({l,ps:ok.filter(p=>p.duration!=null&&p.duration>=lo&&p.duration<hi)}));
  }else g=['reel','foto','carrossel','video'].filter(t=>ok.some(p=>p.type===t)).map(t=>({l:TYPES[t],t,ps:ok.filter(p=>p.type===t)}));
  const st=g.filter(x=>x.ps.length).map(x=>{
    const v=x.ps.map(p=>p.views),w=x.ps.map(p=>p.watch).filter(y=>y!=null),fo=x.ps.map(p=>p.follows).filter(y=>y!=null),sh=x.ps.map(p=>p.shares).filter(y=>y!=null);
    return {l:x.l,n:x.ps.length,av:avg(v),md:med(v),en:avg(x.ps.map(eng).filter(e=>e!=null)),
      ex:TT?(sh.length?N(Math.round(avg(sh)))+' compart.':'—'):x.t==='reel'?(w.length?avg(w).toFixed(1).replace('.',',')+' s assistidos':'—'):(fo.length?sg(avg(fo))+' seg./post':'—')};
  });
  return {st};
}
function formatSection(a,psR){
  const TT=a.platform==='tiktok',{st,noDur}=groupStats(a,psR);
  if(noDur)return `<div class="card"><p class="mut">O robô ainda não coletou a duração dos vídeos do TikTok. Rode o robô novamente e recarregue.</p></div>`;
  if(!st.length)return `<div class="card"><p class="mut">Sem posts com dados neste período.</p></div>`;
  const left=hbars(st.map(x=>({l:x.l,s:`${x.n} post${x.n>1?'s':''}`,v:x.av,t:fmt(Math.round(x.av))})));
  const elig=st.filter(x=>x.n>=3).sort((x,y)=>y.md-x.md);
  let ins='';
  if(elig.length>=2){const b=elig[0],w=elig[elig.length-1];ins=`<p class="ins"><b>${b.l}</b> tem a maior mediana de views (${fmt(Math.round(b.md))}), ${w.md>0?(b.md/w.md).toFixed(1).replace('.',',')+'× a de':'contra'} <b>${w.l}</b>.${st.some(x=>x.n<5)?' Há grupos com menos de 5 posts: use como indício.':''}</p>`}
  return `<div class="row b"><div class="card"><h3>${TT?'Views médias por duração do vídeo':'Views médias por formato'}</h3>${left}${ins}<p class="note">${TT?'Duração informada pelo TikTok.':'O Instagram não informa a duração dos vídeos; para Reels, veja o tempo médio assistido na tabela.'} Posts antigos, que só têm impressões, ficam fora desta comparação.</p></div>
  <div class="card"><h3>Comparação detalhada</h3><table class="tbl"><tr><th>${TT?'Duração':'Formato'}</th><th>Posts</th><th>Views médias</th><th>Mediana</th><th>Engaj.</th><th>${TT?'Compart. por post':'Extra'}</th></tr>${st.map(x=>`<tr><td><b>${x.l}</b></td><td>${x.n}</td><td>${fmt(Math.round(x.av))}</td><td>${fmt(Math.round(x.md))}</td><td>${pct(x.en)}</td><td>${x.ex}</td></tr>`).join('')}</table><p class="note">A mediana é o post "típico": um único post viral não a distorce como faz com a média.</p></div></div>`;
}
function weeksOf(a){
  const r=range(),psR=a.posts.filter(p=>inR(p.date)),nm=netMap(a),today=dkey(new Date());
  const ds=psR.map(p=>dkey(p.date)).sort(),startD=r.a>0?dkey(new Date(r.a)):ds[0];
  if(!startD)return [];
  const wk=k=>{const d=new Date(k+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-(d.getUTCDay()+6)%7);return d.toISOString().slice(0,10)};
  const add=(k,n)=>{const d=new Date(k+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
  const byW={};for(const p of psR)(byW[wk(dkey(p.date))]??=[]).push(p);
  const out=[],endK=wk(dkey(new Date(Math.min(r.b,Date.now()))));
  for(let k=wk(startD);k<=endK;k=add(k,7)){
    if(add(k,6)>=today)continue;           // semana ainda em andamento
    if(r.a>0&&k<startD)continue;           // semana cortada pelo início do período
    const ps=byW[k]||[],bad=ps.some(p=>p.legacy||p.views==null);
    let net=0,ok=true;for(let i=0;i<7;i++){const v=nm[add(k,i)];if(v==null){ok=false;break}net+=v}
    out.push({k,posts:ps.length,views:bad?null:ps.reduce((s,p)=>s+p.views,0),net:ok?net:null});
  }
  return out;
}
function weekChart(W,w=640,h=220){
  const ws=W.slice(-26);if(!ws.length)return null;
  const P={l:46,r:8,t:12,b:42},mx=Math.max(1,...ws.map(x=>x.views||0)),bw=(w-P.l-P.r)/ws.length,Y=v=>P.t+(h-P.t-P.b)*(1-v/mx);
  const bars=ws.map((x,i)=>`<g><title>Semana de ${dayStr(x.k+'T12:00:00')}: ${x.posts} post(s)${x.views!=null?', '+N(x.views)+' views':''}${x.net!=null?', saldo '+sg(x.net,0)+' seguidores':''}</title>${x.views?`<rect x="${P.l+i*bw+bw*.15}" width="${bw*.7}" y="${Y(x.views)}" height="${Math.max(1,h-P.b-Y(x.views))}" rx="3" fill="var(--ac)"/>`:''}<text x="${P.l+i*bw+bw/2}" y="${h-24}" text-anchor="middle" font-size="10.5" fill="${x.posts?'var(--tx)':'var(--mut)'}">${x.posts}</text></g>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}"><line x1="${P.l}" x2="${w-P.r}" y1="${Y(mx)}" y2="${Y(mx)}" stroke="var(--bd)"/><text x="${P.l-6}" y="${Y(mx)+4}" text-anchor="end" font-size="11" fill="var(--mut)">${fmt(mx)}</text><text x="${P.l-6}" y="${h-P.b+4}" text-anchor="end" font-size="11" fill="var(--mut)">0</text>${bars}<text x="${P.l}" y="${h-4}" font-size="11" fill="var(--mut)">${dayStr(ws[0].k+'T12:00:00')}</text><text x="${w-P.r}" y="${h-4}" text-anchor="end" font-size="11" fill="var(--mut)">${dayStr(ws[ws.length-1].k+'T12:00:00')}</text></svg><div class="leg"><span><i style="background:var(--ac)"></i>Views dos posts publicados na semana</span><span>Número embaixo de cada barra: posts da semana</span></div>`;
}
function freqSection(a){
  const W=weeksOf(a);
  if(W.length<2)return '<p class="mut">Escolha um período maior (90 dias ou Tudo) para analisar a frequência por semana.</p>';
  const B=[['Nenhum post',w=>w.posts===0],['1 post',w=>w.posts===1],['2 a 3 posts',w=>w.posts>=2&&w.posts<=3],['4 ou mais',w=>w.posts>=4]];
  const rows=B.map(([l,fn])=>{const ws=W.filter(fn);if(!ws.length)return null;
    const v=ws.filter(w=>w.views!=null).map(w=>w.views),vp=ws.filter(w=>w.views!=null&&w.posts>0).map(w=>w.views/w.posts),n=ws.filter(w=>w.net!=null).map(w=>w.net);
    return `<tr><td><b>${l}</b></td><td>${ws.length}</td><td>${v.length?fmt(Math.round(avg(v))):'—'}</td><td>${vp.length?fmt(Math.round(avg(vp))):'—'}</td><td>${n.length?sg(avg(n),0):'—'}</td></tr>`}).filter(Boolean).join('');
  return (weekChart(W)||'')+`<table class="tbl" style="margin-top:12px"><tr><th>Posts na semana</th><th>Semanas</th><th>Views na semana</th><th>Views por post</th><th>Seguidores na semana</th></tr>${rows}</table><p class="note">Só semanas completas. "Seguidores na semana" aparece apenas onde há saldo de todos os 7 dias (Instagram: últimos 30 dias; TikTok: desde que o robô começou).</p>`;
}
function howCard(a){
  return a.platform==='tiktok'
  ?`<ul class="how"><li>O TikTok informa só o <b>total</b> de seguidores. O robô calcula o saldo diário comparando cada dia com o anterior, então o histórico começa no primeiro dia de coleta.</li><li>Ele <b>não diz</b> quem seguiu ou deixou de seguir, nem de qual vídeo veio cada seguidor.</li><li>Por isso a leitura aqui é por <b>correlação</b>: o que acontece com os seguidores nos dias em que você posta.</li></ul>`
  :`<ul class="how"><li>O Instagram informa <b>ganhos e perdas por dia</b> (últimos 30 dias) e, nas <b>fotos</b>, quantos seguidores vieram de cada post.</li><li>Para <b>Reels</b> não há seguidores por post: compare os dias com Reel no gráfico ao lado.</li><li>Ele <b>não diz</b> quem deixou de seguir, de onde saiu, nem em qual post isso aconteceu.</li></ul>`;
}

/* ───────── detalhado ───────── */
function render(){
  const a=curAcc(),TT=a.platform==='tiktok',pr=profiles().find(x=>x.slug===slug(a.name));
  const r=range(),psR=a.posts.filter(p=>inR(p.date));
  const dP=deltaR(a),base=dP?a.followers-dP.n:null,gp=dP&&base>0?dP.n/base*100:null;
  const fl=(a.flow||[]).filter(x=>inDay(x[0])),gTot=fl.reduce((s,x)=>s+x[1],0),lTot=fl.reduce((s,x)=>s+x[2],0);
  const vs=psR.filter(p=>p.views!=null&&!p.legacy).map(p=>p.views);
  const first=Math.min(Date.now(),...psR.map(p=>Date.parse(p.date))),days=Math.max(1,(R.mode==='all'?Date.now()-first:r.b-r.a)/864e5),perWeek=psR.length/days*7;
  const hist=H?.accounts?.[a.key]?.followers||{},pts=Object.keys(hist).sort().filter(inDay).map(d=>({d,v:hist[d]}));
  const types=[['all','Todos'],...Object.entries(TYPES).filter(([k])=>a.posts.some(p=>p.type===k))];
  const seg=(name,arr)=>arr.map(([k,l])=>`<button class="pill ${String(f[name])===String(k)?'on':''}" data-f="${name}" data-v="${k}">${l}</button>`).join('');
  const sec=(t,s)=>`<div class="sechd"><h2>${t}</h2><p>${s}</p></div>`;

  $('#app').innerHTML=`
  <a class="back" href="#">← Todos os perfis</a>
  <h1>${esc(a.name)} <b>${PN[a.platform]} @${esc(a.username||'')}</b></h1>
  <div class="nets">${pr.accs.map(x=>`<a class="pill ${x.key===a.key?'on':''}" href="#${pr.slug}/${x.platform}">${PN[x.platform]}</a>`).join('')}</div>
  <p class="lead">${N(a.posts.length)} publicações carregadas${a.mediaCount&&a.mediaCount!==a.posts.length?` de ${N(a.mediaCount)} no perfil`:''} · seguindo ${fmt(a.following)}</p>
  ${a.error?`<div class="err">Não consegui atualizar esta conta agora (${esc(a.error)}). Os números abaixo são da última vez que funcionou.</div>`:''}
  <div class="per"><span class="mut">Período:</span>
    <div class="pills">${[['7','7 dias'],['30','30 dias'],['90','90 dias'],['all','Tudo'],['custom','Personalizado']].map(([k,l])=>`<button class="pill ${R.mode===k?'on':''}" data-r="${k}" type="button">${l}</button>`).join('')}</div>
    ${R.mode==='custom'?`<label class="mut">de <input type="date" id="rf" value="${R.from}" max="${dkey(new Date())}"></label><label class="mut">até <input type="date" id="rt" value="${R.to}" max="${dkey(new Date())}"></label>`:''}
  </div>

  <div class="stats">
    <div class="card stat"><div class="l">Seguidores</div><b>${fmt(a.followers)}</b><div class="d">${dl(dP,'no período')||'&nbsp;'}</div><div class="d">${esc(perLabel())}</div></div>
    <div class="card stat"><div class="l">Crescimento no período</div><b>${gp==null?'—':`<span class="${gp>=0?'up':'down'}">${sg(gp,2)}%</span>`}</b><div class="d">${!TT&&fl.length?`<span class="up">+${N(gTot)}</span> ganhos · <span class="down">−${N(lTot)}</span> perdas`:'seguidores novos ÷ base inicial'}</div></div>
    <div class="card stat"><div class="l">Posts no período</div><b>${psR.length}</b><div class="d">${perWeek.toFixed(1).replace('.',',')} por semana</div></div>
    <div class="card stat"><div class="l">Views por post</div><b>${vs.length?fmt(Math.round(avg(vs))):'—'}</b><div class="d">${vs.length?`mediana ${fmt(Math.round(med(vs)))} · total ${fmt(vs.reduce((s,x)=>s+x,0))}`:'sem dados no período'}</div></div>
  </div>

  ${sec('O que faz a conta crescer','Seguidores ao longo do tempo e o que acontece com eles nos dias em que você posta.')}
  <div class="row a">
    <div class="card"><h3>${TT?'Seguidores: saldo por dia':'Seguidores ganhos e perdidos por dia'}</h3>${(TT?flowChart({...a,gains:histGains(a)}):flowChart(a))||'<p class="mut">Sem dados de seguidores por dia neste período.</p>'}<p class="note">${TT?'Saldo calculado pelo robô (total do dia − total do dia anterior).':'Passe o mouse em cada dia para ver ganhos, perdas e saldo. Ganhos e perdas por dia existem só para os últimos 30 dias.'}${a.flowError?' <b>Perdas indisponíveis:</b> '+esc(a.flowError):''}</p></div>
    <div class="card"><h3>Total de seguidores</h3>${line(pts)||'<p class="mut">O gráfico aparece a partir do segundo dia de coleta do robô.</p>'}</div>
  </div>
  <div class="row b">
    <div class="card"><h3>Seguidores por dia: com post × sem post</h3>${netBars(a)}</div>
    <div class="card"><h3>Como ler estes números</h3>${howCard(a)}</div>
  </div>

  ${sec('Posts que mais deram resultado','Os melhores do período, na métrica que você escolher. Clique para ver o post e a curva dele.')}
  <div class="row c">
    <div class="card"><h3>Top 10</h3>${topList(a,psR)}</div>
    <div class="card"><h3>Views por publicação (até 24 no período)</h3>${postBars(a)||'<p class="mut">Sem dados.</p>'}<p class="note">Clique numa barra para abrir o post.</p></div>
  </div>

  ${sec(TT?'Que tipo de conteúdo performa melhor: duração':'Que tipo de conteúdo performa melhor: formato',TT?'Vídeos curtos ou longos: qual rende mais views e engajamento.':'Reel, foto ou carrossel: qual rende mais views e engajamento.')}
  ${formatSection(a,psR)}

  ${sec('Quando e com que frequência postar','Dia e horário com mais views, e o que muda quando você posta mais ou menos por semana.')}
  <div class="row b">
    <div class="card"><h3>Melhor dia e horário para postar</h3>${heat(a)||'<p class="mut">Sem dados.</p>'}</div>
    <div class="card"><h3>Frequência: posts por semana</h3>${freqSection(a)}</div>
  </div>

  <div class="shead" style="margin-top:34px"><h2>Todas as publicações</h2><span class="mut" id="pcount"></span><span class="sp"></span>
    <input id="q" class="srch" type="search" placeholder="Buscar na legenda…" value="${esc(f.q)}">
    ${types.length>2?`<div class="pills">${seg('type',types)}</div>`:''}
    <div class="pills">${seg('sort',[['date','Recentes'],['views','Views'],['likes','Curtidas'],['eng','Engajamento']])}</div>
  </div>
  <div class="grid" id="plist"></div>
  <div class="pager" id="pager"></div>
  <dialog id="dlg"></dialog>`;
  renderList();
}

function renderList(){
  const a=curAcc();
  const list=filtered(a),pages=Math.max(1,Math.ceil(list.length/f.size));
  if(f.page>pages)f.page=pages;
  const from=(f.page-1)*f.size,slice=list.slice(from,from+f.size);
  $('#pcount').textContent=list.length===a.posts.length?`${a.posts.length} publicações`:`${list.length} de ${a.posts.length}`;
  $('#plist').innerHTML=slice.map(card).join('')||'<div class="empty">Nenhuma publicação nesse filtro.</div>';
  const nums=[];for(let i=1;i<=pages;i++)if(i===1||i===pages||Math.abs(i-f.page)<=1)nums.push(i);else if(nums[nums.length-1]!=='…')nums.push('…');
  $('#pager').innerHTML=pages<=1&&list.length<=f.size?'':`<button class="pill" data-pg="${f.page-1}" ${f.page<=1?'disabled':''}>‹ Anterior</button>${nums.map(n=>n==='…'?'<span class="mut">…</span>':`<button class="pill ${n===f.page?'on':''}" data-pg="${n}">${n}</button>`).join('')}<button class="pill" data-pg="${f.page+1}" ${f.page>=pages?'disabled':''}>Próxima ›</button><span class="sp"></span><label class="mut">Por página <select id="psize">${[12,24,48,96].map(n=>`<option ${n===f.size?'selected':''}>${n}</option>`).join('')}</select></label>`;
}

function card(p){
  return `<button class="pc" data-open="${esc(p.id)}" type="button">
    <div class="th">${p.thumb?`<img loading="lazy" src="${esc(p.thumb)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:''}<span class="tag">${TYPES[p.type]||p.type}</span><span class="dt">${dayStr(p.date)}</span></div>
    <div class="bd"><div class="big2"><b>${fmt(p.views)}</b><span>${p.views==null?'sem dados do '+PNAME():p.legacy?'impressões':'views'}</span></div>
    <div class="sm"><span><b>${fmt(p.likes)}</b> curtidas</span><span><b>${fmt(p.comments)}</b> coment.</span>${p.follows!=null?`<span><b>+${fmt(p.follows)}</b> seguidores</span>`:''}${p.type==='tiktok'&&p.shares!=null?`<span><b>${fmt(p.shares)}</b> compart.</span>`:''}</div></div></button>`;
}

function curve(a,p){
  const h=H?.accounts?.[a.key]?.posts?.[p.id]||{},ds=Object.keys(h).sort();
  let max=0;const pts=ds.filter(d=>h[d][0]!=null).map(d=>({d,v:(max=Math.max(max,h[d][0]))}));
  if(pts.length<2)return '<p class="mut">A curva de crescimento aparece a partir do segundo dia de coleta. A plataforma não entrega o passado, então ela começa no dia em que o robô viu o post pela primeira vez.</p>';
  return line(pts,640,200)+`<p class="note">Views acumuladas por dia, desde ${dayStr(pts[0].d+'T12:00:00')} (primeiro dia de coleta).</p>`;
}

function openPost(id){
  const a=curAcc(),p=a.posts.find(x=>x.id===id);if(!p)return;
  const dlg=$('#dlg');
  dlg.innerHTML=`<div class="dh">${p.thumb?`<img src="${esc(p.thumb)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:''}<div><h3>${esc(p.caption)||'Sem legenda'}</h3><span class="mut">${TYPES[p.type]} · ${new Date(p.date).toLocaleDateString('pt-BR',{timeZone:BRT,day:'2-digit',month:'long',year:'numeric'})}</span></div><button class="x" data-close type="button" aria-label="Fechar">×</button></div>
  <div class="db"><div class="dm">
    ${p.type==='tiktok'?`<div><span>Views</span><b>${N(p.views)}</b></div><div><span>Curtidas</span><b>${N(p.likes)}</b></div><div><span>Comentários</span><b>${N(p.comments)}</b></div><div><span>Compartilhamentos</span><b>${N(p.shares)}</b></div><div><span>Engajamento</span><b>${pct(eng(p))}</b></div><div><span>Duração</span><b>${p.duration!=null?p.duration+' s':'—'}</b></div>`:`
    <div><span>${p.legacy?'Impressões':'Views'}</span><b>${N(p.views)}</b></div><div><span>Alcance</span><b>${N(p.reach)}</b></div>
    <div><span>Curtidas</span><b>${N(p.likes)}</b></div><div><span>Comentários</span><b>${N(p.comments)}</b></div>
    <div><span>Salvos</span><b>${N(p.saved)}</b></div><div><span>Compartilhamentos</span><b>${N(p.shares)}</b></div>
    <div><span>Engajamento</span><b>${pct(eng(p))}</b></div>
    <div><span>${p.type==='reel'?'Tempo médio assistido':'Visitas ao perfil'}</span><b>${p.type==='reel'?(p.watch!=null?p.watch.toString().replace('.',',')+' s':'—'):N(p.visits)}</b></div>
    ${p.type==='reel'?'':`<div><span>Seguidores ganhos</span><b>${p.follows!=null?'+'+N(p.follows):'—'}</b></div>`}`}
  </div>
  ${p.type==='reel'?'<p class="note" style="margin:-6px 0 12px">O Instagram não informa quantos seguidores vieram de um Reel. Para Reels, compare os dias de publicação no gráfico de ganhos por dia.</p>':''}
  <h3 style="font:500 16px var(--f);margin:6px 0 8px">Crescimento de views</h3>${curve(a,p)}
  <p style="margin:16px 0 0"><a class="nchip" style="display:inline-block" href="${esc(p.url)}" target="_blank" rel="noopener">Abrir no ${p.type==='tiktok'?'TikTok':'Instagram'}</a></p></div>`;
  dlg.showModal();
}

document.addEventListener('click',e=>{
  const tm=e.target.closest('[data-tm]');if(tm){topM=tm.dataset.tm;render();return}
  const o=e.target.closest('[data-open]');if(o){openPost(o.dataset.open);return}
  if(e.target.closest('[data-close]')||e.target.id==='dlg'){$('#dlg').close();return}
  const rb=e.target.closest('[data-r]');if(rb){R.mode=rb.dataset.r;if(R.mode==='custom'&&!R.from){R.to=new Date().toLocaleDateString('en-CA',{timeZone:BRT});R.from=new Date(Date.now()-30*864e5).toLocaleDateString('en-CA',{timeZone:BRT})}f.page=1;render();return}
  const g=e.target.closest('[data-pg]');if(g&&!g.disabled){f.page=+g.dataset.pg;renderList();$('#plist').scrollIntoView({block:'start',behavior:'smooth'});return}
  const b=e.target.closest('[data-f]');if(b){f[b.dataset.f]=b.dataset.v;f.page=1;render()}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){f.q=e.target.value;f.page=1;renderList()}});
document.addEventListener('change',e=>{
  if(e.target.id==='rf'||e.target.id==='rt'){R.from=$('#rf').value;R.to=$('#rt').value;f.page=1;render();return}if(e.target.id==='psize'){f.size=+e.target.value;f.page=1;renderList()}});
load();
</script>
</body>
</html>
