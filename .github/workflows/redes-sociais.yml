name: Redes sociais

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      tiktok_code:
        description: 'Código do TikTok (só na primeira conexão; gere em tiktok-conectar.html)'
        required: false
        default: ''
      tiktok_conta:
        description: 'Conta que vai receber o código (ex.: gba-music-tiktok ou gba-worship-tiktok)'
        required: false
        default: ''
      tiktok_zerar:
        description: 'Escreva sim para apagar o histórico antigo do TikTok dessa conta (só se ele estiver errado)'
        required: false
        default: ''

concurrency:
  group: redes-sociais

permissions:
  contents: write

jobs:
  social:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Buscar dados (Instagram e TikTok)
        run: node src/social.cjs
        env:
          SOCIAL_ACCOUNTS: ${{ secrets.SOCIAL_ACCOUNTS }}
          SOCIAL_ACCOUNTS_EXTRA: ${{ secrets.SOCIAL_ACCOUNTS_EXTRA }}
          SOCIAL_ACCOUNTS_3: ${{ secrets.SOCIAL_ACCOUNTS_3 }}
          SOCIAL_ACCOUNTS_4: ${{ secrets.SOCIAL_ACCOUNTS_4 }}
          SOCIAL_ACCOUNTS_5: ${{ secrets.SOCIAL_ACCOUNTS_5 }}
          SOCIAL_ACCOUNTS_6: ${{ secrets.SOCIAL_ACCOUNTS_6 }}
          TIKTOK_CODE: ${{ inputs.tiktok_code }}
          TIKTOK_CONTA: ${{ inputs.tiktok_conta }}
          TIKTOK_ZERAR: ${{ inputs.tiktok_zerar }}

      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/social.json docs/social-history.json
          # adiciona a pasta state inteira (um 'git add' com padrão sem arquivos correspondentes falha e não salva nada)
          if [ -d state ]; then git add -f state; fi
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git commit -m "Atualiza redes sociais"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
