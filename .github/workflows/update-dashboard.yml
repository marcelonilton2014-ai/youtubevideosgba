name: Atualizar dashboard

on:
  schedule:
    - cron: '*/30 * * * *'   # rápido: a cada 30 minutos
    - cron: '0 9 * * *'      # completo: 1x por dia (06h em Brasília)
  workflow_dispatch:
    inputs:
      mode:
        description: 'quick = só o que importa | full = todos os vídeos'
        default: 'quick'
        type: choice
        options: [quick, full]

permissions:
  contents: write

# nunca roda duas atualizações ao mesmo tempo
concurrency:
  group: atualizar-dashboard
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODE: ${{ github.event.schedule == '0 9 * * *' && 'full' || github.event.inputs.mode || 'quick' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rodar o robô
        run: node src/check.js
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          MODE: ${{ env.MODE }}

      - name: Salvar alterações
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state docs
          if git diff --cached --quiet; then
            echo "Sem mudanças para salvar."
            exit 0
          fi
          git commit -m "Atualiza dados ($MODE)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
