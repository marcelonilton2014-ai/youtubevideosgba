<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YOUTUBE ARTISTAS GBA MUSIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f7f9;--pn:#fff;--card:#f4f5f8;--tx:#111827;--mut:#6b7280;--bd:#e8eaef;--bar:#e9ebf1;--ok:#0f9d6b;--warn:#b45309;--warnbg:#fef3c7;
  --sh:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.05);
  --f:'Inter',system-ui,-apple-system,sans-serif;
}
@media(prefers-color-scheme:dark){:root{--bg:#0b0d14;--pn:#13161f;--card:#1a1e2a;--tx:#f3f4f8;--mut:#9aa1b5;--bd:#252a39;--bar:#262b3b;--ok:#34d399;--warn:#fbbf24;--warnbg:#3a2e0b;--sh:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14.5px/1.5 var(--f);-webkit-font-smoothing:antialiased}
a{color:inherit}button{font-family:inherit}

/* topo */
.top{background:var(--pn);border-bottom:1px solid var(--bd)}
.top .in{max-width:1120px;margin:0 auto;padding:20px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:11px;background:var(--tx);color:var(--pn);display:grid;place-items:center;font:800 14px var(--f);letter-spacing:-.3px;flex:none}
.top h1{font:800 clamp(17px,3.4vw,22px)/1.1 var(--f);letter-spacing:-.02em;margin:0}
.top .sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.hact{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rbtn{display:inline-flex;align-items:center;gap:6px;background:var(--pn);color:var(--tx);border:1px solid var(--bd);font-weight:600;font-size:13px;padding:8px 15px;border-radius:99px;cursor:pointer;transition:all .15s}
.rbtn:hover{border-color:var(--tx)}.rbtn[disabled]{opacity:.7;cursor:progress}
#msg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--tx);color:var(--pn);padding:11px 18px;border-radius:12px;font-size:13.5px;max-width:min(92vw,520px);box-shadow:0 8px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#msg.on{opacity:1}
.navlink{display:inline-flex;align-items:center;gap:6px;background:var(--tx);color:var(--pn);font-weight:600;font-size:13px;text-decoration:none;padding:9px 16px;border-radius:99px;transition:opacity .15s}
.navlink:hover{opacity:.85}
.spine{display:flex;height:3px}.spine i{flex:1}

main{max-width:1120px;margin:0 auto;padding:24px 16px 70px}

/* abas */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--bd);border-radius:99px;background:var(--pn);color:var(--mut);font-size:13.5px;font-weight:500;cursor:pointer;transition:all .15s}
.tab::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.tab:hover{color:var(--tx);border-color:var(--c)}
.tab.on{background:var(--tx);border-color:var(--tx);color:var(--pn);font-weight:600}
.tab:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.badge{background:var(--c);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px}

.panel{background:var(--pn);border:1px solid var(--bd);border-radius:20px;padding:26px 24px 32px;box-shadow:var(--sh);min-height:320px}

/* cabeçalho do painel */
.ph{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mono{width:48px;height:48px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center;font:800 16px var(--f);flex:none}
.ph h2{font:800 clamp(22px,4vw,28px)/1.1 var(--f);letter-spacing:-.025em;margin:0}
.ph .mut{font-size:13.5px}
.mut{color:var(--mut)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:22px 0 0}
.stat{background:var(--card);border-radius:14px;padding:14px 16px}
.stat b{display:block;font:800 24px/1.1 var(--f);letter-spacing:-.02em}
.stat span{font-size:12.5px;color:var(--mut)}

.sec{display:flex;align-items:center;gap:10px;margin:36px 0 14px}
.sec h3{font:700 17px var(--f);margin:0;letter-spacing:-.015em}
.sec span{font-size:13px;color:var(--mut)}
.sec .pill{background:var(--tx);color:var(--pn);font-weight:700;font-size:12px;padding:2px 9px;border-radius:99px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}

/* METAS BATIDAS (destaque no topo) */
.hits{margin:26px 0 0}
.hits .sec{margin-top:0}
.hitlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:14px}
.hit{position:relative;display:flex;gap:16px;align-items:stretch;border-radius:18px;padding:14px;border:1px solid color-mix(in srgb,var(--c) 35%,var(--bd));background:linear-gradient(135deg,color-mix(in srgb,var(--c) 14%,var(--pn)),var(--pn) 70%);overflow:hidden}
.hit::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:var(--c);opacity:.08}
.hit .th{flex:none;width:168px;align-self:center}
.hit .th img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-radius:11px}
.hit .b{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1;justify-content:center}
.medal{align-self:flex-start;background:var(--c);color:#fff;font-weight:800;font-size:13px;padding:4px 12px;border-radius:99px;letter-spacing:-.01em}
.hit .big{font:800 22px/1.05 var(--f);letter-spacing:-.025em}
.hit .ti{font-weight:600;font-size:13.5px;text-decoration:none;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hit .ch{font-size:12px;color:var(--mut);font-weight:500}
.hit .foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;margin-top:2px}
.pend{background:var(--warnbg);color:var(--warn);font-weight:700;font-size:11.5px;padding:2px 9px;border-radius:99px}
.done{color:var(--ok);font-weight:700;font-size:11.5px}
.hit.isdone{opacity:.62}
.chk{display:flex;align-items:center;gap:7px;cursor:pointer;font-weight:500}
.chk input{width:17px;height:17px;accent-color:var(--c)}
@media(max-width:520px){.hit{flex-direction:column}.hit .th{width:100%}}

/* pastas de artistas */
.folder{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid transparent;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;transition:all .15s}
.folder:hover{border-color:var(--c);background:var(--pn);box-shadow:var(--sh);transform:translateY(-2px)}
.folder:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.folder .t{display:flex;align-items:center;gap:12px}
.folder .mono{width:40px;height:40px;font-size:14px;border-radius:12px}
.folder .n{font:700 15.5px/1.15 var(--f)}
.folder .v{font-size:12.5px;color:var(--mut)}
.folder .m{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut)}
.folder .m b{font-size:14px;color:var(--tx)}

/* cards de vídeo */
.card{background:var(--card);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;border:1px solid transparent;transition:all .15s}
.card:hover{background:var(--pn);border-color:var(--bd);box-shadow:var(--sh)}
.card .th{position:relative}
.card .th img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.tag{position:absolute;left:10px;top:10px;background:rgba(17,24,39,.78);backdrop-filter:blur(4px);color:#fff;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px}
.card .b{padding:12px 14px 15px;display:flex;flex-direction:column;gap:7px}
.card .ti{font-weight:600;text-decoration:none;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .ch{font-size:12px;color:var(--c);font-weight:600}
.bar{height:8px;background:var(--bar);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px}
.row{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--mut)}
.row b{font-size:15px;color:var(--tx)}

/* tabela */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input[type=text],input:not([type]),select{background:var(--card);color:var(--tx);border:1px solid transparent;border-radius:10px;padding:9px 13px;font:inherit;font-size:13.5px}
input:focus-visible,select:focus-visible{outline:2px solid var(--c,#6366f1);outline-offset:1px;background:var(--pn)}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:14px}
table{width:100%;border-collapse:collapse}
th{background:var(--card);font-size:11.5px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:11px 12px;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--bd);font-size:13.5px;white-space:nowrap}
td:nth-child(2){white-space:normal;min-width:240px}
tbody tr:hover td{background:var(--card)}
td img{border-radius:7px;display:block}
td a{text-decoration:none;font-weight:500}td a:hover{text-decoration:underline}
td .pct{display:inline-block;min-width:34px;font-weight:700;color:var(--c)}
.empty{padding:20px;color:var(--mut);background:var(--card);border-radius:14px;grid-column:1/-1;font-size:13.5px}

@media(max-width:560px){.panel{padding:18px 14px 24px;border-radius:16px}.hact{margin-left:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="in">
    <div class="logo">GBA</div>
    <div>
      <h1>YOUTUBE ARTISTAS GBA MUSIC</h1>
      <div class="sub" id="upd">Carregando…</div>
    </div>
    <div class="hact"><button class="rbtn" id="refresh" type="button">🔄 Atualizar agora</button><a class="navlink" href="acompanhamento.html">📈 Acompanhamento de projetos</a></div>
  </div>
  <div class="spine" id="spine"></div>
</header>

<main>
  <div class="tabs" id="tabs" role="tablist"></div>
  <section class="panel" id="panel">
    <div class="ph">
      <div class="mono" id="mono">GBA</div>
      <div><h2 id="ptitle">Visão geral</h2><div class="mut" id="psub"></div></div>
    </div>

    <!-- metas batidas: logo no topo, com destaque -->
    <div class="hits" id="hitswrap">
      <div class="sec"><h3>🎉 Metas batidas</h3><span class="pill" id="hitcount">0</span><span>últimos 14 dias</span></div>
      <div class="hitlist" id="hit"></div>
    </div>

    <div class="stats" id="stats"></div>

    <div id="artwrap">
      <div class="sec"><h3>Pastas dos artistas</h3><span>clique para abrir</span></div>
      <div class="grid" id="artists"></div>
    </div>

    <div class="sec"><h3>🔥 Quase lá</h3><span id="nearsub">perto da próxima meta</span></div>
    <div class="grid" id="near"></div>

    <div class="sec"><h3>Todos os vídeos</h3></div>
    <div class="tools">
      <input id="q" placeholder="Buscar vídeo…">
      <select id="ch"><option value="">Todos os canais</option></select>
      <select id="so">
        <option value="progress">Mais perto da meta</option>
        <option value="views">Mais views</option>
        <option value="recent">Mais recentes</option>
      </select>
    </div>
    <div class="tw"><table><thead><tr><th></th><th>Vídeo</th><th>Canal</th><th>Views</th><th>Próxima meta</th><th>Faltam</th><th>Previsão</th></tr></thead><tbody id="rows"></tbody></table></div>
  </section>
</main>
<div id="msg" role="status" aria-live="polite"></div>

<script>
const $=s=>document.querySelector(s), fmt=n=>n.toLocaleString('pt-BR');
const cmp=new Intl.NumberFormat('pt-BR',{notation:'compact',maximumFractionDigits:1});
const lab=n=>n>=1e6?(n/1e6).toLocaleString('pt-BR')+(n===1e6?' milhão':' milhões'):(n/1e3).toLocaleString('pt-BR')+' mil';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eta=d=>d==null?'—':d<=1?'~1 dia':d>365?'> 1 ano':`~${d} dias`;

/* cor de cada artista (novos canais ganham uma cor automática) */
const COLORS={'Danubia MJ':'#d9467a','Davidson Silva':'#2f6fed','Fátima Souza':'#8a52d9','Flávio Vitor':'#e5532d','GBA Music':'#e0a800','Ramone Rafael':'#16a077','Um Peregrino':'#0e93b0'};
const EXTRA=['#c2410c','#4d7c0f','#a21caf','#0369a1','#be123c','#7c6f00'];
const colorOf=c=>{if(!c)return'#6366f1';if(COLORS[c])return COLORS[c];let h=0;for(const ch of c)h=(h*31+ch.charCodeAt(0))>>>0;return EXTRA[h%EXTRA.length]};
const initials=c=>c?c.split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase():'GBA';

let posted={};try{posted=JSON.parse(localStorage.getItem('posted')||'{}')}catch(e){}
const savePosted=()=>{try{localStorage.setItem('posted',JSON.stringify(posted))}catch(e){}};
let D,cur='',chans=[];
fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{D=d;init()}).catch(()=>$('#upd').textContent='Não consegui carregar data.json');

const list=()=>cur?D.videos.filter(v=>v.channel===cur):D.videos;
const isNear=v=>v.next&&v.progress>=D.nearRatio;
const hitKey=v=>v.id+':'+v.lastMilestone;

function hitCard(v){
  const k=hitKey(v),done=!!posted[k];
  return `<div class="hit ${done?'isdone':''}" style="--c:${colorOf(v.channel)}">
    <div class="th"><img loading="lazy" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" alt=""></div>
    <div class="b">
      <span class="medal">🏆 Meta batida</span>
      <div class="big">${lab(v.lastMilestone)}</div>
      <a class="ti" href="https://youtu.be/${v.id}" target="_blank" rel="noopener">${esc(v.title)}</a>
      <span class="ch">${esc(v.channel)} · ${fmt(v.views)} views · ${v.reachedAt.split('-').reverse().join('/')}</span>
      <div class="foot"><label class="chk"><input type="checkbox" data-k="${k}" ${done?'checked':''}> Post feito</label>${done?'<span class="done">✔ publicado</span>':'<span class="pend">Post pendente</span>'}</div>
    </div></div>`;
}

function card(v){
  return `<div class="card" style="--c:${colorOf(v.channel)}">
    <div class="th"><img loading="lazy" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" alt=""><span class="tag">${Math.floor(v.progress*100)}% da meta</span></div>
    <div class="b"><a class="ti" href="https://youtu.be/${v.id}" target="_blank" rel="noopener">${esc(v.title)}</a><span class="ch">${esc(v.channel)}</span>
     <div class="row"><b>${fmt(v.views)}</b><span>meta: ${lab(v.next)}</span></div>
     <div class="bar"><i style="width:${Math.min(100,v.progress*100)}%"></i></div>
     <div class="row"><span>faltam ${fmt(v.remaining)}</span><span>${v.etaDays!=null?'previsão '+eta(v.etaDays):''}</span></div></div></div>`;
}

function applyData(){
  $('#upd').textContent=D.updatedAt?'Atualizado em '+new Date(D.updatedAt).toLocaleString('pt-BR'):'Ainda sem dados: rode o workflow no GitHub Actions.';
  $('#nearsub').textContent='a '+Math.round(D.nearRatio*100)+'% ou mais da próxima meta';
  chans=[...new Set(D.videos.map(v=>v.channel))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  $('#spine').innerHTML=chans.map(c=>`<i style="background:${colorOf(c)}"></i>`).join('');
  $('#ch').innerHTML='<option value="">Todos os canais</option>'+chans.map(c=>`<option>${esc(c)}</option>`).join('');
  readHash();
}

function init(){
  $('#hit').onchange=e=>{if(e.target.dataset.k){posted[e.target.dataset.k]=e.target.checked;savePosted();render()}};
  const go=e=>{const b=e.target.closest('[data-c]');if(b)location.hash=b.dataset.c?encodeURIComponent(b.dataset.c):''};
  $('#tabs').onclick=go;$('#artists').onclick=go;
  ['q','ch','so'].forEach(i=>$('#'+i).oninput=table);
  addEventListener('hashchange',readHash);
  $('#refresh').onclick=refresh;
  applyData();
}

/* ===== botão Atualizar agora ===== */
const OWNER='marcelonilton2014-ai',REPO='youtubevideosgba',BRANCH='main';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let msgT;const say=(t,ms=6500)=>{const m=$('#msg');m.textContent=t;m.classList.add('on');clearTimeout(msgT);msgT=setTimeout(()=>m.classList.remove('on'),ms)};
const getToken=()=>{try{return localStorage.getItem('ghtoken')||''}catch(e){return''}};
const loadData=()=>fetch('data.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json());
let busy=false;
async function refresh(){
  if(busy)return;busy=true;
  const btn=$('#refresh'),label='🔄 Atualizar agora',t0=D.updatedAt;btn.disabled=true;
  try{
    const T=getToken();
    if(!T){
      btn.textContent='⏳ Recarregando…';
      const n=await loadData();const novo=n.updatedAt!==t0;D=n;applyData();
      say(novo?'Dados novos carregados.':'Os dados já estão atualizados. Para rodar o robô agora, conecte o GitHub na página de Acompanhamento (token com permissão Actions).',novo?4000:9000);
      return;
    }
    btn.textContent='⏳ Iniciando robô…';
    const H={Authorization:'Bearer '+T,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
    const api=`https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows`;
    const r=await fetch(api,{headers:H});
    if(r.status===401||r.status===403||r.status===404)throw new Error('Seu token não tem permissão de Actions. No GitHub, edite o token e coloque "Actions: Read and write".');
    if(!r.ok)throw new Error('Não consegui falar com o GitHub agora. Tente de novo em instantes.');
    const wf=(await r.json()).workflows||[];const w=wf.find(x=>/atualizar/i.test(x.name))||wf[0];
    if(!w)throw new Error('Não encontrei o workflow do robô no repositório.');
    const d=await fetch(`${api}/${w.id}/dispatches`,{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({ref:BRANCH})});
    if(d.status!==204)throw new Error(d.status===403||d.status===404?'Seu token não tem permissão para rodar o robô (Actions: Read and write).':'O GitHub não aceitou iniciar o robô. Veja se o workflow está ativo em Actions.');
    btn.textContent='⏳ Atualizando…';say('Robô iniciado. Leva de 1 a 3 minutos; a página atualiza sozinha.',7000);
    for(let i=0;i<32;i++){
      await sleep(15000);
      let n;try{n=await loadData()}catch(e){continue}
      if(n.updatedAt!==t0){D=n;applyData();say('Atualizado ✔',4000);return}
    }
    say('O robô ainda está processando. Recarregue a página em alguns minutos.',9000);
  }catch(e){say(e.message,9000)}
  finally{busy=false;btn.disabled=false;btn.textContent=label}
}

function readHash(){
  let c='';try{c=decodeURIComponent(location.hash.slice(1))}catch(e){}
  cur=chans.includes(c)?c:'';
  render();
}

function render(){
  const cut=Date.now()-14*864e5, V=list(), col=colorOf(cur);
  $('#panel').style.setProperty('--c',col);
  $('#tabs').innerHTML=[''].concat(chans).map(c=>{
    const n=D.videos.filter(v=>(!c||v.channel===c)&&isNear(v)).length;
    return `<button class="tab ${c===cur?'on':''}" style="--c:${colorOf(c)}" role="tab" aria-selected="${c===cur}" data-c="${esc(c)}">${c?esc(c):'Geral'}${n?`<span class="badge" title="vídeos quase na meta">${n}</span>`:''}</button>`;
  }).join('');

  $('#mono').textContent=initials(cur);
  $('#ptitle').textContent=cur||'Visão geral';
  $('#psub').textContent=(cur?'Pasta do artista · ':'Todos os artistas · ')+cmp.format(V.reduce((s,v)=>s+v.views,0))+' views somadas';

  const near=V.filter(isNear).sort((a,b)=>b.progress-a.progress);
  // metas batidas: pendentes de post primeiro, depois as mais recentes
  const hit=V.filter(v=>v.reachedAt&&new Date(v.reachedAt)>=cut)
    .sort((a,b)=>(!!posted[hitKey(a)]-!!posted[hitKey(b)])||b.reachedAt.localeCompare(a.reachedAt));
  const pend=hit.filter(v=>!posted[hitKey(v)]).length;
  const st=[[fmt(V.length),'vídeos monitorados'],[near.length,'quase lá'],[hit.length,'bateram em 14 dias'],[pend,'posts pendentes']];
  if(!cur)st.push([chans.length,'artistas']);
  $('#stats').innerHTML=st.map(([n,t])=>`<div class="stat"><b>${n}</b><span>${t}</span></div>`).join('');

  $('#hitcount').textContent=hit.length;
  $('#hit').innerHTML=hit.map(hitCard).join('')||'<div class="empty">Nenhuma meta batida nos últimos 14 dias. Quando algum vídeo bater uma meta, ele aparece aqui no topo.</div>';

  $('#artwrap').style.display=cur?'none':'';
  if(!cur){
    $('#artists').innerHTML=chans.map(c=>{
      const vs=D.videos.filter(v=>v.channel===c), tv=vs.reduce((s,v)=>s+v.views,0), n=vs.filter(isNear).length;
      return `<button class="folder" style="--c:${colorOf(c)}" data-c="${esc(c)}">
        <div class="t"><div class="mono">${esc(initials(c))}</div><div><div class="n">${esc(c)}</div><div class="v">${cmp.format(tv)} views</div></div></div>
        <div class="m"><span>${fmt(vs.length)} vídeos</span><span><b>${n}</b> quase lá</span></div></button>`;
    }).join('');
  }

  $('#near').innerHTML=near.map(card).join('')||'<div class="empty">Nenhum vídeo perto de uma meta agora.</div>';
  $('#ch').style.display=cur?'none':'';
  $('#ch').value='';
  table();
}

function table(){
  const q=$('#q').value.toLowerCase(),ch=cur?'':$('#ch').value,so=$('#so').value;
  const s={progress:(a,b)=>b.progress-a.progress,views:(a,b)=>b.views-a.views,recent:(a,b)=>b.publishedAt.localeCompare(a.publishedAt)}[so];
  $('#rows').innerHTML=list().filter(v=>(!ch||v.channel===ch)&&v.title.toLowerCase().includes(q)).sort(s).slice(0,500).map(v=>
   `<tr style="--c:${colorOf(v.channel)}"><td><img src="https://i.ytimg.com/vi/${v.id}/default.jpg" width="64" loading="lazy" alt=""></td>
    <td><a href="https://youtu.be/${v.id}" target="_blank" rel="noopener">${esc(v.title)}</a></td><td>${esc(v.channel)}</td>
    <td>${fmt(v.views)}</td><td>${v.next?lab(v.next)+' <span class="pct">'+Math.floor(v.progress*100)+'%</span>':'—'}</td><td>${v.next?fmt(v.remaining):'—'}</td><td>${eta(v.etaDays)}</td></tr>`).join('');
}
</script>
</body>
</html>
